<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css">
        <title> login </title>
    </head>
    <body>
        <div class="page-login">
            <div class="img-login">

            </div>
            <div class="login-section">
                <div class="login-box">
                    <h2>login</h2>
                    <form>
                        <div class="input-box">
                            <input type="text" name="username" placeholder="username" required>
                        </div>
                        <div class="input-box">
                            <input type="password" name="password" placeholder="password" required>
                        </div>
                        <div class="to-remember">
                            <label><input type="checkbox">remember me</label> 
                        </div>
                        <button type="submit">login</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background: linear-gradient(rgb(0, 0, 0),rgb(0, 0, 0));
    font-family: Arial, Helvetica, sans-serif;
    
}
.page-login{
    display: flex;
    width: 100%;
    height: 100vh;
    min-height:0;
    direction: ltr;
    min-height: 0;
}
.img-login {
    width: 52%;
    min-height: 100vh;
    background:url("volleyball.jpg");
    background-size: cover;
    
    background-position: center;
    position: relative;
}
.login-section {
    display: flex;
    width: 400px;
    height: calc(100vh -200px);
    border-radius: 30px;
    background: rgb(10, 10, 10);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow:0 8px 32px rgb(210, 82, 27),inset 0 1px 1px rgba(255, 255, 255, 0.15);
    justify-content: center;
    align-items: center;
    margin-left: 12%;
    margin-top: 100px;
    margin-bottom: 100px;
    box-sizing: border-box;
}
.login-box h2{
    color: #bd2d05;
    font-family: Georgia, 'Times New Roman', Times, serif;
    font-size:33px;
    text-align: center;
    margin-top: 0;
    margin-bottom: 35px;
}
.login-box{
    height: 80%; 
    width: 80%;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.input-box{
    margin: 30px;
}
.input-box input{
    width:300px;
    height: 50px;
    background: transparent;
    border: none;
    outline: none;
    border: 2px solid rgb(183, 43, 4);
    border-radius: 40px;
    font-size: 16px;
    color: #fff;
    padding: 20px 45px 20px 20px;
}
.to-remember{
    color: #e13709;
    
}
input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgb(183, 43, 4);
    border-radius: 50%;
    cursor: pointer;
    margin-left:31px;
}
input[type="checkbox"]:checked {
    background-color:rgb(221, 52, 6);
}
label{
    display: flex;
    align-items: center;
}
label input[type="checkbox"] {
    margin-right: 7px;
}
button{
    color: #d14f04;
    background: #151515;
    justify-content: center;
    font-size: 20px;
    font-family: Georgia, 'Times New Roman', Times, serif;
    align-items: center;
    display: block;
    margin: 0 auto;
    margin-top: 40px;
    width: 300px;
    height: 50px;
    border-radius: 40px;
    border: none;
    outline: none;
    cursor: pointer;
}
button:hover{
    background:#1f1f1f;
}





</style>
</html>
